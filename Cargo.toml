[workspace]
resolver = "2"
members = [
    "crates/wakey-core",
    "crates/wakey-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform caffeinate alternative with smart schedules, AI agent detection, and habit learning"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
humantime = "2.1"
