[[bin]]
name = "wakey"
path = "src/main.rs"

[dependencies]
wakey-core = { path = "../wakey-core" }
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
humantime = "2.1"
